<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Currency Converter</title>
</head>
<body>

<h2>Currency Converter</h2>

<input type="number" id="amount" placeholder="Amount"><br><br>

<input type="text" id="base" placeholder="Base currency (USD)"><br><br>

<input type="text" id="target" placeholder="Target currency (TZS)"><br><br>

<button id="convertBtn">Convert</button>

<p id="result"></p>
<p id="date"></p>

<h3>Rates Table</h3>
<table border="1">
    <thead>
        <tr>
            <th>Currency</th>
            <th>Rate</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script src="script.js"></script>

</body>
</html>
